<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + Tailwind Demo — almostnode agent runtime</title>
    <link rel="stylesheet" href="./shared-styles.css" />
    <style>
      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1px;
        background: var(--border);
        height: calc(100vh - 44px);
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="demo-topbar">
      <a href="../index.html" class="back">← demos</a>
      <span class="sep">/</span>
      <a href="../index.html" class="logo">almostnode</a>
      <span class="sep">/</span>
      <span class="title">Vite + Tailwind</span>
      <span class="tag">vite · tailwind · plugin</span>
    </div>

    <div class="hmr-indicator" id="reload-indicator">Reload</div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-label">Editor</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="status-dot" id="status-dot"></div>
            <span class="panel-label" id="status-text">Initializing...</span>
          </div>
        </div>

        <div class="file-tabs" id="file-tabs">
          <button class="file-tab active" data-file="/index.html"><span class="dot"></span>index.html</button>
          <button class="file-tab" data-file="/vite.config.ts"><span class="dot"></span>vite.config.ts</button>
          <button class="file-tab" data-file="/src/style.css"><span class="dot"></span>style.css</button>
          <button class="file-tab" data-file="/src/main.js"><span class="dot"></span>main.js</button>
        </div>

        <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
          <textarea id="editor" placeholder="Loading..."></textarea>
        </div>

        <div class="toolbar">
          <button id="save-btn" class="btn btn-primary" disabled>Save</button>
          <button id="run-btn" class="btn btn-secondary" disabled>Start Preview</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-label">Live Preview</span>
          <button id="refresh-btn" class="btn btn-secondary" style="padding:4px 10px;">Refresh</button>
        </div>
        <div class="preview-placeholder" id="preview-placeholder">
          Click Start Preview to launch the Vite + Tailwind project
        </div>
        <iframe id="preview-frame" class="preview-frame" style="display:none;"></iframe>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-label">Console</span>
          <button id="clear-btn" class="btn btn-secondary" style="padding:4px 10px;">Clear</button>
        </div>
        <div class="terminal" id="output"></div>
      </div>
    </div>

    <script type="module">
      import { initViteTailwindDemo, startViteTailwindDevServer } from '../src/vite-tailwind-demo.ts';

      const outputEl = document.getElementById('output');
      const editorEl = document.getElementById('editor');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const saveBtn = document.getElementById('save-btn');
      const runBtn = document.getElementById('run-btn');
      const refreshBtn = document.getElementById('refresh-btn');
      const clearBtn = document.getElementById('clear-btn');
      const fileTabsEl = document.getElementById('file-tabs');
      const previewFrame = document.getElementById('preview-frame');
      const previewPlaceholder = document.getElementById('preview-placeholder');
      const reloadIndicator = document.getElementById('reload-indicator');

      let vfs = null;
      let devServer = null;
      let devServerUrl = null;
      let currentFile = '/index.html';
      let previewActive = false;

      function log(message, className = '') {
        const line = document.createElement('div');
        line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        if (className) line.className = className;
        outputEl.appendChild(line);
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      function setStatus(status, text) {
        statusDot.className = 'status-dot ' + status;
        statusText.textContent = text;
      }

      function showReloadIndicator() {
        reloadIndicator.classList.add('show');
        setTimeout(() => reloadIndicator.classList.remove('show'), 1600);
      }

      function loadFile(path) {
        if (!vfs) return;
        try {
          editorEl.value = vfs.readFileSync(path, 'utf8');
          currentFile = path;
          document.querySelectorAll('.file-tab').forEach((tab) => {
            tab.classList.toggle('active', tab.dataset.file === path);
          });
        } catch (error) {
          log(`Error loading ${path}: ${error.message}`, 'error');
        }
      }

      function saveFile() {
        if (!vfs || !currentFile) return;
        try {
          vfs.writeFileSync(currentFile, editorEl.value);
          log(`Saved: ${currentFile}`);
        } catch (error) {
          log(`Error saving ${currentFile}: ${error.message}`, 'error');
        }
      }

      function connectPreviewFrame() {
        previewFrame.onload = () => {
          if (devServer && previewFrame.contentWindow) {
            devServer.setHMRTarget(previewFrame.contentWindow);
            log('Live reload target connected', 'hmr');
          }
        };
      }

      async function startPreview() {
        if (devServerUrl) {
          previewPlaceholder.style.display = 'none';
          previewFrame.style.display = 'block';
          previewActive = true;
          connectPreviewFrame();
          previewFrame.src = devServerUrl;
          log('Preview started');
          return;
        }

        try {
          runBtn.disabled = true;
          setStatus('', 'Starting dev server...');
          const result = await startViteTailwindDevServer(vfs, { port: 3000, log });
          devServer = result.server;
          devServerUrl = result.url;
          devServer.on('hmr-update', (update) => {
            log(`${update.type}: ${update.path}`, 'hmr');
            showReloadIndicator();
          });
          setStatus('running', 'Dev server running');
          runBtn.textContent = 'Preview Running';
          await startPreview();
        } catch (error) {
          setStatus('error', 'Preview failed');
          log(`Preview error: ${error.message}`, 'error');
          runBtn.disabled = false;
        }
      }

      function refreshPreview() {
        if (!previewActive || !devServerUrl) return;
        connectPreviewFrame();
        previewFrame.src = devServerUrl + '?t=' + Date.now();
        log('Preview refreshed');
      }

      function init() {
        try {
          setStatus('', 'Initializing...');
          vfs = initViteTailwindDemo();
          loadFile(currentFile);
          saveBtn.disabled = false;
          runBtn.disabled = false;
          setStatus('running', 'Ready');
          log('Demo ready. This project follows the Vite + Tailwind plugin setup.');
          log('Edit index.html or src/style.css and save to test live reload.', 'info');
        } catch (error) {
          setStatus('error', 'Error');
          log(`Init error: ${error.message}`, 'error');
        }
      }

      saveBtn.addEventListener('click', saveFile);
      runBtn.addEventListener('click', startPreview);
      refreshBtn.addEventListener('click', refreshPreview);
      clearBtn.addEventListener('click', () => { outputEl.innerHTML = ''; });
      fileTabsEl.addEventListener('click', (event) => {
        const tab = event.target.closest('.file-tab');
        if (tab) loadFile(tab.dataset.file);
      });
      editorEl.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 's') {
          event.preventDefault();
          saveFile();
        }
      });

      init();
    </script>
  </body>
</html>
